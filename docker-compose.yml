version: '3.8'

services:
  # PostgreSQL database for UMC memory storage
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umc_memory
      POSTGRES_USER: umc_user
      POSTGRES_PASSWORD: umc_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umc_user -d umc_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umc_network

  # UMC Memory Server (FastAPI middleware)
  umc-server:
    build:
      context: .
      dockerfile: Dockerfile.umc
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://umc_user:umc_password_change_me@postgres:5432/umc_memory
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - umc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # n8n workflow automation (integrated with UMC)
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_me_please
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Los_Angeles
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=umc_user
      - DB_POSTGRESDB_PASSWORD=umc_password_change_me
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      umc-server:
        condition: service_healthy
    networks:
      - umc_network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  umc_network:
    driver: bridge
